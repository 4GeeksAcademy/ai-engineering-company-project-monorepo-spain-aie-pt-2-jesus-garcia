[project]
name = "trackflow-weekly-performance"
version = "0.1.0"
description = "Pipeline semanal de desempeño por almacén y cliente (Prefect + SQL)."
requires-python = ">=3.11"
dependencies = [
    "prefect>=3,<4",
    "pandas>=2",
    "SQLAlchemy>=2",
    "psycopg2-binary",
    "python-dotenv",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-cov",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["../.."]
addopts = "-q"
