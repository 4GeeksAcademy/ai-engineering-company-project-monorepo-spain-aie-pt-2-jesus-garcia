[project]
name = "trackflow-api"
version = "0.2.0"
description = "TrackFlow API — autenticación, proveedores e incidentes (FastAPI)."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "python-dotenv",
    "python-multipart",
    "pandas",
    "pydantic",
    "httpx",
    "tinydb",
    "sqlmodel",
    "psycopg2-binary",
    "passlib[bcrypt]",
    "bcrypt",
    "python-jose[cryptography]",
    "resend",
    "celery[redis]",
    "flower",
    "qdrant-client>=1.20,<2",
    "langgraph>=1.2.21",
    "langchain-mcp-adapters>=0.3.1,<0.4",
    "mcp>=1.24,<2",
    "markitdown[pdf]>=0.1.3",
    "pypdf>=5.0",
    "py-readability-metrics>=1.4.5",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-cov",
    "httpx",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"