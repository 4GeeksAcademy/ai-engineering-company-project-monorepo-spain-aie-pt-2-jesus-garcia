services:
  # Broker y result backend de Celery. Política noeviction: Redis nunca
  # descarta mensajes por presión de memoria.
  redis:
    image: redis:7-alpine
    command:
      [
        "redis-server",
        "--maxmemory-policy",
        "noeviction",
        "--appendonly",
        "yes",
      ]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped
    networks: [monorepo-dev]

  # Base de datos vectorial del RAG (MILESTONE 7). La colección
  # `trackflow_knowledge` se crea desde `data/process/rag_index.py`.
  qdrant:
    image: qdrant/qdrant:v1.20.1
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant-data:/qdrant/storage
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1",
        ]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped
    networks: [monorepo-dev]

  uis:
    build: ./uis
    ports:
      - "3000:3000"
      - "3001:3001"
    environment:
      BACKEND_URL: http://services:8000
      NEXT_PUBLIC_API_URL: http://localhost:8000
      NEXT_PUBLIC_TELEMETRY_ENDPOINT: /api/telemetry/events
      NEXT_PUBLIC_TELEMETRY_SAMPLE_RATE: "1.0"
      NEXT_PUBLIC_TELEMETRY_ENABLED: "false"
    env_file: .env
    volumes:
      - ./uis/website:/uis/website
      - ./uis/backoffice:/uis/backoffice
      - ./shared:/shared
      - ./src:/src
      - ui-node-website:/uis/website/node_modules
      - ui-node-backoffice:/uis/backoffice/node_modules
      - ui-next-website:/uis/website/.next
      - ui-next-backoffice:/uis/backoffice/.next
    networks: [monorepo-dev]

  # `services/api/.env` (bind-mounted en /app) se carga con load_dotenv()
  # dentro del contenedor; por eso no se usa como env_file y no sobreescribe
  # DATABASE_URL/SECRET_KEY del .env raíz.
  services:
    build: ./services
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      PREFECT_API_URL: http://prefect-server:4200/api
      PYTHONPATH: /app:/
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      INCIDENT_UPLOAD_DIR: /uploads
      # En la red de Compose el host es el servicio `qdrant`, no localhost.
      QDRANT_URL: http://qdrant:6333
      # El agente consume las tools desde el MCP Server dentro de la red Compose.
      MCP_SERVER_URL: ${MCP_SERVER_URL:-http://mcp:8001/mcp}
    volumes:
      - ./services/api:/app
      - ./services/reporting:/services/reporting
      - ./services/__init__.py:/services/__init__.py
      - ./data:/app/data
      - ./docs/company-knowledge-base:/app/docs/company-knowledge-base:ro
      - task-uploads:/uploads
    depends_on:
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    networks: [monorepo-dev]

  # MCP Server (FastMCP + mcpauth). Expone /mcp y el Protected Resource
  # Metadata; el agente lo consume con langchain-mcp-adapters.
  mcp:
    build:
      context: ./mcps/trackflow-mcp
    ports:
      - "8001:8001"
    env_file:
      - .env
      - ./mcps/trackflow-mcp/.env
    environment:
      # En la red Compose la API se resuelve por nombre de servicio.
      TRACKFLOW_API_BASE_URL: ${TRACKFLOW_API_BASE_URL_DOCKER:-http://services:8000}
    depends_on:
      - services
    restart: unless-stopped
    networks: [monorepo-dev]

  # Worker Celery: proceso independiente del servidor FastAPI.
  worker:
    build: ./services
    command: celery -A celery_app worker --loglevel=INFO --concurrency=1
    env_file: .env
    environment:
      PYTHONPATH: /app:/
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      INCIDENT_UPLOAD_DIR: /uploads
    volumes:
      - ./services/api:/app
      - ./services/reporting:/services/reporting
      - ./services/__init__.py:/services/__init__.py
      - task-uploads:/uploads
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks: [monorepo-dev]

  # Monitorización de la cola durante el desarrollo.
  flower:
    build: ./services
    command: celery -A celery_app flower --port=5555
    ports:
      - "5555:5555"
    env_file: .env
    environment:
      PYTHONPATH: /app:/
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
    volumes:
      - ./services/api:/app
      - ./services/reporting:/services/reporting
      - ./services/__init__.py:/services/__init__.py
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks: [monorepo-dev]

  # Job nocturno: export de telemetría + pipeline de desempeño.
  # El cron vive en `scripts/crontab` (02:15 UTC) y NO toca el proceso de la API.
  scheduler:
    build:
      context: .
      dockerfile: scripts/Dockerfile
    env_file: .env
    environment:
      TZ: UTC
      DATABASE_URL: ${DATABASE_URL:-}
      DATABASE_URL_PIPELINE: ${DATABASE_URL_PIPELINE:-}
      TARGET_DATE: ${TARGET_DATE:-}
      JOB_STALE_MINUTES: ${JOB_STALE_MINUTES:-60}
      PIPELINE_TIMEOUT_SECONDS: ${PIPELINE_TIMEOUT_SECONDS:-1800}
      PIPELINE_INSTRUMENTATION_SINCE: ${PIPELINE_INSTRUMENTATION_SINCE:-}
    volumes:
      - ./scripts:/app/scripts
      - ./services/job_runner:/app/services/job_runner
      - ./services/__init__.py:/app/services/__init__.py
      - ./pipelines:/app/pipelines
      - ./data/pipelines:/app/data/pipelines
      - ./data/raw:/app/data/raw
    restart: unless-stopped
    networks: [monorepo-dev]

  # Prefect self-hosted (perfil opcional: docker compose --profile prefect up)
  prefect-server:
    image: prefecthq/prefect:3.9.0-python3.12
    profiles: ["prefect"]
    command: prefect server start --host 0.0.0.0
    ports:
      - "4200:4200"
    environment:
      PREFECT_API_DATABASE_CONNECTION_URL: sqlite+aiosqlite:////data/prefect.db
      PREFECT_SERVER_ANALYTICS_ENABLED: "false"
    volumes:
      - prefect-data:/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:4200/api/health')\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped
    networks: [monorepo-dev]

  prefect-init:
    image: prefecthq/prefect:3.9.0-python3.12
    profiles: ["prefect"]
    depends_on:
      prefect-server:
        condition: service_healthy
    environment:
      PREFECT_API_URL: http://prefect-server:4200/api
    command: >
      sh -c "prefect work-pool create trackflow-pool --type process --overwrite || true"
    networks: [monorepo-dev]

  prefect-deploy:
    build:
      context: .
      dockerfile: pipelines/weekly_performance/Dockerfile
    profiles: ["prefect"]
    depends_on:
      prefect-init:
        condition: service_completed_successfully
    environment:
      PREFECT_API_URL: http://prefect-server:4200/api
    working_dir: /app
    command: >
      sh -c "prefect deploy --all --no-prompt --pool trackflow-pool --concurrency-limit 1"
    networks: [monorepo-dev]

  prefect-worker:
    build:
      context: .
      dockerfile: pipelines/weekly_performance/Dockerfile
    profiles: ["prefect"]
    depends_on:
      prefect-server:
        condition: service_healthy
      prefect-init:
        condition: service_completed_successfully
    environment:
      PREFECT_API_URL: http://prefect-server:4200/api
      DATABASE_URL_PIPELINE: ${DATABASE_URL_PIPELINE}
      PIPELINE_LOOKBACK_WEEKS: ${PIPELINE_LOOKBACK_WEEKS:-3}
      PIPELINE_INSTRUMENTATION_SINCE: ${PIPELINE_INSTRUMENTATION_SINCE:-}
      PIPELINE_ALERT_WEBHOOK: ${PIPELINE_ALERT_WEBHOOK:-}
    volumes:
      - ./pipelines:/app/pipelines
    command: prefect worker start --pool trackflow-pool --type process
    restart: unless-stopped
    networks: [monorepo-dev]

networks:
  monorepo-dev:
    name: monorepo-dev

volumes:
  ui-node-website:
  ui-node-backoffice:
  ui-next-website:
  ui-next-backoffice:
  prefect-data:
  redis-data:
  qdrant-data:
  task-uploads: