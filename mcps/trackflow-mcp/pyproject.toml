[project]
name = "trackflow-mcp"
version = "0.1.0"
description = "TrackFlow MCP Server — incidents and inventory tools protected with MCP Auth (OAuth 2.1 / OIDC)."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.24,<2",
    "mcpauth==0.2.0b1",
    "httpx>=0.28,<1",
    "uvicorn[standard]>=0.31",
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.26",
    "respx>=0.22",
    "asgi-lifespan>=2.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-q"
