# TrackFlow — endurecimiento SSH
# Instalar en /etc/ssh/sshd_config.d/99-trackflow-hardening.conf
# Aplicar con: sudo sshd -t && sudo systemctl reload ssh

PermitRootLogin no
PasswordAuthentication no
KbdInteractiveAuthentication no
PubkeyAuthentication yes
AllowUsers trackflow-ops
MaxAuthTries 3
MaxSessions 4
X11Forwarding no
AllowAgentForwarding no
PermitTunnel no
ClientAliveInterval 300
ClientAliveCountMax 2
LoginGraceTime 30
